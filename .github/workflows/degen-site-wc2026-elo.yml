# WC 2026 corner model — daily Elo refresh from eloratings.net.
# Schedule: 6:15 AM Pacific daily.
#
# Required repository secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
name: WC 2026 Elo update (daily)

on:
  schedule:
    - cron: "15 6 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: degen-site-wc2026-elo
  cancel-in-progress: false

jobs:
  elo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: degen-site

    env:
      TZ: America/Los_Angeles
      AWS_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: degen-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Run Elo update
        run: bash scripts/updateWc2026.sh elo
