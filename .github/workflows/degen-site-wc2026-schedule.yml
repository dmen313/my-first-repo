# WC 2026 corner model — scheduled data refresh (corners + odds).
# Schedule: every 30 minutes from 8:00 AM through 11:30 PM Pacific, daily.
#
# Required repository secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# Optional:
#   AWS_REGION (defaults to us-east-1)
#   API_FOOTBALL_KEY — API-Football / api-sports.io (corner stats)
#   ODDS_API_KEY — forwarded as ODDS_API_KEY and REACT_APP_ODDS_API_KEY
#
# Note: Scheduled workflows use the latest commit on the default branch.
name: WC 2026 data update (scheduled)

on:
  schedule:
    - cron: "*/30 8-23 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      mode:
        description: "data (corners+odds), corners, odds, elo, or all"
        required: false
        default: data

permissions:
  contents: read

concurrency:
  group: degen-site-wc2026-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: degen-site

    env:
      TZ: America/Los_Angeles
      AWS_REGION: us-east-1
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      APISPORTS_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      REACT_APP_ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: degen-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Run updateWc2026.sh
        run: bash scripts/updateWc2026.sh "${{ github.event.inputs.mode || 'data' }}"
